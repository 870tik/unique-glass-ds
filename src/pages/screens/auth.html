<!-- ============ 認証: Auth（中央1カラム・シェルなし） ============ -->
<div class="standalone lg-layout-auth" id="sc-auth" data-title="認証（Auth）" data-class=".lg-layout-auth + .lg-auth-card">
  <div class="lg-glass lg-auth-card">
    <div>
      <div class="lg-type-display">Sign in</div>
      <div class="lg-type-caption" data-sc="sc17">Glassworks へようこそ</div>
    </div>
    <div class="lg-form-row">
      <label class="lg-form-label" for="auEmail">Email</label>
      <div class="lg-field lg-field--fill" style="border-radius:var(--lg-field-radius)">
        <input class="lg-field-input" id="auEmail" type="email" placeholder="you@example.com">
      </div>
    </div>
    <div class="lg-form-row">
      <label class="lg-form-label" for="auPass">Password</label>
      <div class="lg-field lg-field--fill" style="border-radius:var(--lg-field-radius)">
        <input class="lg-field-input" id="auPass" type="password" placeholder="••••••••">
      </div>
    </div>
    <button class="lg-glass lg-button lg-button--primary" data-lg-gel style="width:100%">Continue</button>
    <button class="lg-button lg-button--quiet" data-back data-lg-gel style="width:100%">画面一覧に戻る</button>
  </div>
</div>
