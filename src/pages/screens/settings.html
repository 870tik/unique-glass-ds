<!-- ============ 設定画面: Settings ============ -->
    <section class="screen lg-page" id="sc-settings" data-title="設定（Settings）" data-class=".lg-layout-settings + .lg-subnav（md↓で横タブ化）">
      <div class="lg-page-header"><div class="row"><h1 class="lg-type-display" style="margin:0">Settings</h1></div></div>
      <div class="lg-layout-settings">
        <nav class="lg-subnav" aria-label="設定メニュー">
          <button aria-current="true">General</button>
          <button>Billing</button>
          <button>Members</button>
          <button>Notifications</button>
          <button>API</button>
        </nav>
        <div data-sc="sc13">
          <div class="lg-panel" data-sc="sc14">
            <div class="lg-type-heading">General</div>
            <div class="lg-form-row">
              <label class="lg-form-label" for="stName">Workspace name</label>
              <div class="lg-glass lg-field" data-sc="sc15"><input class="lg-field-input" id="stName" value="Glassworks"></div>
            </div>
            <label class="lg-switch"><input type="checkbox" checked><span class="lg-switch-track"><span class="lg-switch-knob"></span></span>Auto-send receipts</label>
            <label class="lg-switch"><input type="checkbox"><span class="lg-switch-track"><span class="lg-switch-knob"></span></span>Weekly summary</label>
          </div>
          <div class="lg-banner"><div>プランの更新日は 10 月 1 日です。</div><button class="lg-banner-close" aria-label="閉じる"><i data-lg-icon="x"></i></button></div>
        </div>
      </div>
    </section>
