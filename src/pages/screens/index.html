<!doctype html>
<html lang="ja" data-lg-surface="dark" data-lg-observer="personal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layouts — Unique Glass DS</title>
<!-- @include src/pages/_shared/persona-boot.html -->
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/liquid-glass.css">
<link rel="stylesheet" href="../css/themes/studio-dark.css">
<style>
:root { --mono: var(--lg-ref-type-family-mono); }
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%;
  background: color-mix(in srgb, var(--lg-ref-color-opaque-dark) 88%, var(--lg-ref-color-black));
}
body {
  font-family: -apple-system, "Helvetica Neue", "Hiragino Sans", sans-serif;
  color: var(--lg-adaptive-dark-ink);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.tag { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; opacity: .55; }
/* iframe 用の枠（真のネスト viewport） */
.demo-stage { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 var(--lg-ref-space-lg) var(--lg-ref-space-lg); }
.demo-stage-head { display: flex; align-items: baseline; gap: var(--lg-ref-space-md); flex-wrap: wrap; margin: 2px 4px var(--lg-ref-space-md); }
.demo-stage-head h1 { font-size: 20px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
.demo-stage-head .demo-note { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; opacity: .5; }
.demo-frame {
  flex: 1; min-height: 0; width: 100%; display: block;
  border: 1px solid color-mix(in srgb, var(--lg-adaptive-dark-ink) 14%, transparent);
  border-radius: var(--lg-ref-radius-xl);
  background: color-mix(in srgb, var(--lg-ref-color-opaque-dark) 92%, var(--lg-ref-color-black));
}
/* SP はこの画面を提供しない（案内のみ） */
.demo-sp-note { display: none; }
@media (max-width: 700px) {
  .demo-stage, .persona-dock { display: none !important; }
  .demo-sp-note {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: var(--lg-ref-space-md);
    flex: 1; min-height: 0;
    margin: 0 var(--lg-ref-space-lg) var(--lg-ref-space-lg);
    padding: var(--lg-ref-space-2xl);
    text-align: center;
    border: 1px solid color-mix(in srgb, var(--lg-adaptive-dark-ink) 14%, transparent);
    border-radius: var(--lg-ref-radius-xl);
  }
}
</style>
</head>
<body>
<!-- @include src/pages/_shared/global-header.html -->
<div class="demo-sp-note">
  <p class="lg-type-body" style="margin:0">この画面は PC でご覧ください。</p>
  <p class="lg-type-caption" style="margin:0; opacity:.6">実物のレイアウトとデモは、広い画面で本来の構成を確認できます。</p>
  <a class="lg-glass lg-button" data-lg-gel href="index.html">ホームへ戻る</a>
</div>
<div class="demo-stage">
  <div class="demo-stage-head"><h1>Layouts</h1><span class="demo-note">7つの画面型 — 枠内のナビで切替（SP 対応）</span></div>
  <!-- iframe = 真のネスト viewport。fixed・100vh・sticky が設計どおり振る舞う -->
  <iframe class="demo-frame" src="screens-live.html" title="Layouts"></iframe>
</div>
<!-- @include src/pages/_shared/persona-dock.html -->
<script src="../js/lg-icons.js"></script>
<script src="../js/liquid-glass.js"></script>
</body>
</html>
