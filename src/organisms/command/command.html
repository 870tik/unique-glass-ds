<!-- Command palette — ⌘K / Ctrl+K 自動。入力フィルタ + 矢印 + Enter -->
<div class="lg-backdrop lg-backdrop--command" data-lg-surface="dark" aria-hidden="true">
  <div class="lg-glass lg-command" role="dialog" aria-modal="true" aria-label="コマンドパレット">
    <input class="lg-command-input" type="text" placeholder="Type a command…" aria-label="コマンド検索">
    <div class="lg-command-list">
      <button class="lg-command-item">Go to Dashboard <span class="hint">G D</span></button>
      <button class="lg-command-item">Create invoice</button>
    </div>
    <div class="lg-command-empty" hidden>No matching commands</div>
  </div>
</div>
