<!-- Modal — LiquidGlass.modal(backdropEl) で配線（Esc・scrim クリック対応） -->
<div class="lg-backdrop" id="myModal" data-lg-surface="dark" aria-hidden="true">
  <div class="lg-glass lg-modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" tabindex="-1">
    <h4 id="mTitle">Delete invoice?</h4>
    <p>この操作は取り消せません。</p>
    <div class="actions">
      <button class="lg-button lg-button--quiet" data-lg-gel>Cancel</button>
      <button class="lg-button lg-button--solid lg-button--danger" data-lg-gel>Delete</button>
    </div>
  </div>
</div>
