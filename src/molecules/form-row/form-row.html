<!-- Form row — ラベル + 入力 + ヘルプ。エラーは .is-error -->
<div class="lg-form-row">
  <label class="lg-form-label" for="f1">Workspace name</label>
  <div class="lg-glass lg-field"><input class="lg-field-input" id="f1"></div>
  <span class="lg-help">請求書のヘッダーに表示されます</span>
</div>
<div class="lg-form-row is-error">
  <label class="lg-form-label" for="f2">Webhook URL</label>
  <div class="lg-glass lg-field is-error"><input class="lg-field-input" id="f2"></div>
  <span class="lg-help lg-help--error">URL の形式が正しくありません</span>
</div>
