<!-- Number input — .lg-step でステップ。min/max/step を尊重（自動配線） -->
<div class="lg-glass lg-field lg-field--number">
  <button class="lg-step" data-step="-1" aria-label="減らす"><i data-lg-icon="minus"></i></button>
  <input class="lg-field-input" type="number" value="1" min="0" max="99" step="1" aria-label="数量">
  <button class="lg-step" data-step="1" aria-label="増やす"><i data-lg-icon="plus"></i></button>
</div>
